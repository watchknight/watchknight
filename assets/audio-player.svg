<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="100%" height="110">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes eq1 { 0%, 100% { height: 6px; y: 44px; } 50% { height: 26px; y: 24px; } }
    @keyframes eq2 { 0%, 100% { height: 24px; y: 26px; } 50% { height: 10px; y: 40px; } }
    @keyframes eq3 { 0%, 100% { height: 14px; y: 36px; } 50% { height: 32px; y: 18px; } }
    @keyframes eq4 { 0%, 100% { height: 28px; y: 22px; } 50% { height: 8px; y: 42px; } }
    @keyframes eq5 { 0%, 100% { height: 8px; y: 42px; } 50% { height: 22px; y: 28px; } }
    @keyframes pulseDot { 0%, 100% { r: 4px; opacity: 1; } 50% { r: 6px; opacity: 0.6; } }

    .bar1 { animation: eq1 1.2s ease-in-out infinite; }
    .bar2 { animation: eq2 0.9s ease-in-out infinite; }
    .bar3 { animation: eq3 1.4s ease-in-out infinite; }
    .bar4 { animation: eq4 1.0s ease-in-out infinite; }
    .bar5 { animation: eq5 1.3s ease-in-out infinite; }
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  </style>

  <!-- Player Background Card -->
  <rect x="2" y="2" width="596" height="106" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Accent Glowing Border Left -->
  <path d="M 16 2 L 2 16 L 2 94 L 16 108" fill="none" stroke="url(#eqGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Album Art / Vinyl Disc Icon (Left) -->
  <g transform="translate(24, 20)">
    <!-- Vinyl Disc -->
    <circle cx="35" cy="35" r="32" fill="#090D13" stroke="#30363D" stroke-width="2" />
    <circle cx="35" cy="35" r="24" fill="none" stroke="#21262D" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="none" stroke="#30363D" stroke-width="1.5" />
    <circle cx="35" cy="35" r="10" fill="url(#eqGrad)" />
    <circle cx="35" cy="35" r="4" fill="#0D1117" />
  </g>

  <!-- Track Title & Artist -->
  <text x="105" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F0F6FC">
    Deep Flow: Mindful Web Architecture
  </text>
  <text x="105" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">
    Ambient Lo-Fi Beats &amp; Modular Synthesizers 🍵
  </text>

  <!-- Progress Bar Container -->
  <rect x="105" y="74" width="370" height="4" rx="2" fill="#21262D" />
  <!-- Progress Bar Fill -->
  <rect x="105" y="74" width="235" height="4" rx="2" fill="url(#eqGrad)" />
  <circle cx="340" cy="76" r="5" fill="#00F5D4" filter="url(#glow)" class="pulse-dot" />

  <!-- Time Labels -->
  <text x="485" y="80" font-family="monospace, sans-serif" font-size="11" fill="#8B949E">
    02:45 / 04:20
  </text>

  <!-- Animated Sound Equalizer (Right Side) -->
  <g fill="url(#eqGrad)" filter="url(#glow)">
    <rect x="540" y="30" width="4" height="20" rx="2" class="bar1" />
    <rect x="548" y="25" width="4" height="25" rx="2" class="bar2" />
    <rect x="556" y="20" width="4" height="30" rx="2" class="bar3" />
    <rect x="564" y="25" width="4" height="25" rx="2" class="bar4" />
    <rect x="572" y="32" width="4" height="18" rx="2" class="bar5" />
  </g>
</svg>
